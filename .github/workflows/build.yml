name: Build & Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Rust
        uses: dtolabs/rust-action@master
        with:
          rust-version: stable

      - name: Install dependencies
        run: |
          pnpm install
          pnpm tauri build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: predator-control-linux
          path: src-tauri/target/release/predator-control
